[package]
name = "nuvio-streaming"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "nuvio_streaming"
crate-type = ["cdylib", "rlib"]

[features]
default = ["http-engine"]
http-engine = ["dep:reqwest", "dep:tokio", "dep:tokio-util", "dep:jni", "dep:httpdate"]

[dependencies]
reqwest = { version = "=0.12.24", optional = true, default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "=1.48.0", optional = true, features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-util = { version = "=0.7.16", optional = true, features = ["rt"] }
jni = { version = "=0.21.1", optional = true }
httpdate = { version = "=1.0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
