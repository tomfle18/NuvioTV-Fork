[package]
name = "nuvio-streaming-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
nuvio-streaming = { path = "..", default-features = false }

[[bin]]
name = "range_store"
path = "fuzz_targets/range_store.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
